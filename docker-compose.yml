version: '3.8'

services:
  task-service-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: task-service-dev
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot reload
      - ./src:/app/src:delegated
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./.env:/app/.env:ro
      # Use named volumes for node_modules to avoid conflicts
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
    command: pnpm dev:container
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/v1/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  task-service-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-service-prod
    ports:
      - "3001:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/v1/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - production

volumes:
  node_modules:
